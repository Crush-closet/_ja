<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crush Closet | Luxury Collection</title>
    <!-- Tailwind CSS for modern layout components -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        magenta: '#C70066',
                        branddark: '#111111',
                    }
                }
            }
        }
    </script>
    <style>
        :root { 
            --gold: #D4AF37; 
            --magenta: #C70066; 
            --black: #111; 
            --white: #fff;
            --gray-bg: #f5f5f5;
            --text-muted: #777;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; color: var(--black); padding-bottom: 120px; overflow-x: hidden; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Header Bar */
        .top-navbar {
            position: sticky;
            top: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            z-index: 200;
        }
        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 16:9 Hero Slider Styles */
        .hero-slider-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            background-color: #000;
        }
        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            object-fit: cover;
        }
        .hero-slide.active {
            opacity: 1;
        }
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            font-size: 16px;
            transition: background 0.3s;
        }
        .slider-arrow:hover { background: rgba(0, 0, 0, 0.8); }
        .slider-arrow.prev { left: 10px; }
        .slider-arrow.next { right: 10px; }

        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dot.active {
            background: var(--gold);
            width: 20px;
            border-radius: 10px;
        }

        /* Hero / Social Banner */
        .inner-circle { background: var(--black); color: var(--gold); padding: 18px 15px; text-align: center; }
        .inner-circle h3 { margin-bottom: 4px; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
        .insta-btn { display: inline-block; margin-top: 10px; background: var(--gold); color: #000; padding: 8px 24px; text-decoration: none; font-weight: bold; border-radius: 50px; text-transform: uppercase; font-size: 11px; }

        /* Category Menu Bar */
        .filter-menu { display: flex; overflow-x: auto; background: #fff; padding: 12px 15px; position: sticky; top: 48px; z-index: 100; gap: 8px; border-bottom: 1px solid #eee; }
        .filter-menu::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 8px 18px; border: 1px solid #e5e5e5; background: #fff; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; color: #444; }
        .filter-btn.active { background: var(--black); color: #fff; border-color: var(--black); }

        /* Product Grid (2 Columns) */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .product-card { 
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            position: relative;
            animation: fadeInUp 0.4s ease forwards;
        }
        .product-image-wrap {
            position: relative;
            width: 100%;
            padding-top: 120%;
            background: #f9f9f9;
        }
        .product-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 13px; font-weight: 600; color: #222; margin-bottom: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .stock-tag { font-size: 11px; color: var(--magenta); font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
        .sales-tag { font-size: 11px; color: #777; margin-bottom: 8px; }

        .card-bottom-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; }
        .price-box { display: flex; flex-direction: column; }
        .current-price { font-size: 15px; font-weight: 800; color: #000; }
        .jmd-label { font-size: 10px; color: #888; text-transform: uppercase; }

        .quick-cart-btn {
            background: #f2f2f2;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }
        .quick-cart-btn:hover { background: #e0e0e0; }

        .checkout-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 12px 16px; border-top: 1px solid #eee; z-index: 1000; }
        .footer-buttons { display: flex; gap: 10px; max-width: 500px; margin: 0 auto; }
        .cart-float { flex: 1; background: var(--black); color: #fff; padding: 14px 0; border-radius: 50px; font-weight: bold; border: none; font-size: 13px; text-transform: uppercase; cursor: pointer; }
        .share-btn { background: #f2f2f2; color: var(--black); padding: 14px 20px; border-radius: 50px; font-weight: bold; border: 1px solid #ddd; font-size: 12px; cursor: pointer; }

        .whatsapp-float {
            position: fixed;
            bottom: 80px;
            right: 16px;
            background-color: #25d366;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1001;
            text-decoration: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .modal-overlay.bottom-sheet {
            align-items: flex-end;
            padding: 0;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 24px;
            animation: fadeInUp 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .bottom-sheet .modal-content { border-radius: 20px 20px 0 0; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
        .close-modal-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #888; }
        
        .size-options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .size-btn {
            padding: 12px 0;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .size-btn.selected { border-color: var(--black); background: var(--black); color: #fff; }

        #cart-dashboard {
            display: none;
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--black);
            padding-bottom: 15px;
        }
        .dashboard-items-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .dashboard-item-card {
            background: #fff;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .dashboard-item-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .dashboard-item-info { flex-grow: 1; }
        .dashboard-item-title { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
        .dashboard-item-size { color: #666; font-size: 11px; margin-bottom: 2px; }
        .dashboard-item-price { color: var(--magenta); font-weight: bold; font-size: 13px; }
        .dashboard-remove-btn { background: none; border: none; color: #999; cursor: pointer; font-size: 20px; padding: 4px 8px; }
        
        .cart-summary-box {
            background: #fff;
            border: 1px dashed var(--gold);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            text-align: center;
        }
        .empty-dashboard { text-align: center; color: #777; font-size: 14px; padding: 40px 0; }
        .back-home-btn { background: var(--black); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TOP NAV HEADER (Login button placed right beside the shopping cart icon) -->
    <div class="top-navbar">
        <div class="brand-title flex items-center gap-2">
            <span class="bg-black text-[10px] text-yellow-400 font-bold px-2 py-0.5 rounded-full border border-yellow-500">JA</span>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Customer Auth / Login Button -->
            <div id="userHeaderBox">
                <button onclick="openAuthModal('login')" class="text-xs font-bold bg-black text-white px-3 py-1.5 rounded-full hover:bg-gray-800 transition">
                    🔑 Login
                </button>
            </div>

            <!-- Shopping Cart Icon with smaller badge size -->
            <div class="relative cursor-pointer text-xl p-1.5" onclick="openCartDashboard()">
                🛒 <span class="absolute top-0 right-0 bg-pink-600 text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full" id="header-cart-count">0</span>
            </div>
        </div>
    </div>

    <!-- 16:9 HERO BANNER SLIDESHOW -->
    <div class="hero-slider-container">
        <img src="hero1.jpg" class="hero-slide active" alt="Hero 1">
        <img src="hero2.jpg" class="hero-slide" alt="Hero 2">
        <img src="hero3.jpg" class="hero-slide" alt="Hero 3">
        <img src="hero4.jpg" class="hero-slide" alt="Hero 4">
        <img src="hero5.jpg" class="hero-slide" alt="Hero 5">

        <button class="slider-arrow prev" onclick="changeHeroSlide(-1)">❮</button>
        <button class="slider-arrow next" onclick="changeHeroSlide(1)">❯</button>

        <div class="slider-dots">
            <span class="dot active" onclick="goToHeroSlide(0)"></span>
            <span class="dot" onclick="goToHeroSlide(1)"></span>
            <span class="dot" onclick="goToHeroSlide(2)"></span>
            <span class="dot" onclick="goToHeroSlide(3)"></span>
            <span class="dot" onclick="goToHeroSlide(4)"></span>
        </div>
    </div>

    <!-- HOMEPAGE VIEW -->
    <div id="home-view">
        <div class="inner-circle">
            <h3>✨ CRUSH CLOSET JA ✨</h3>
            <p class="text-[11px] text-gray-300 mt-1">Trendy Bikinis, Dresses, Shirts, Cologne & Accessories</p>
            <a href="https://instagram.com/crush_closet_ja" class="insta-btn" target="_blank">Follow @crush_closet_ja</a>
        </div>

        <div class="filter-menu">
            <button class="filter-btn active" onclick="showCategory('bikini', this)">Bikinis</button>
            <button class="filter-btn" onclick="showCategory('dress', this)">Dresses</button>
            <button class="filter-btn" onclick="showCategory('shirt', this)">Shirts</button>
            <button class="filter-btn" onclick="showCategory('cologne', this)">Cologne</button>
            <button class="filter-btn" onclick="showCategory('bracelet', this)">Bracelets</button>
            <button class="filter-btn" onclick="showCategory('lipstick', this)">Lipstick</button>
        </div>

        <div id="product-display" class="product-grid"></div>

        <a href="https://wa.me/18763047407?text=Hi,%20I%20have%20a%20question%20about%20an%20item%20at%20crush%20closet!" class="whatsapp-float" target="_blank" title="Chat on WhatsApp">💬</a>

        <div class="checkout-footer">
            <div class="footer-buttons">
                <button class="cart-float" onclick="openCartDashboard()">
                    View Bag (<span id="cart-count">0</span>)
                </button>
                <button class="share-btn" onclick="shareWebsite()">🔗 Share</button>
            </div>
        </div>
    </div>

    <!-- CUSTOMER AUTHENTICATION MODAL (Login / Signup) -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="authModalTitle">Login to Crush Closet</div>
                <button class="close-modal-btn" onclick="closeAuthModal()">&times;</button>
            </div>

            <!-- Tab Buttons -->
            <div class="flex border-b mb-4">
                <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-center border-b-2 border-black text-xs uppercase">Login</button>
                <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-center text-gray-400 border-b-2 border-transparent text-xs uppercase">Create Account</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Username</label>
                    <input type="text" id="authUsername" required placeholder="e.g. fashionista99" class="w-full p-2.5 border rounded-lg text-xs focus:ring-2 focus:ring-black outline-none">
                </div>

                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="authEmail" required placeholder="customer@example.com" class="w-full p-2.5 border rounded-lg text-xs focus:ring-2 focus:ring-black outline-none">
                </div>

                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="authPassword" required minlength="4" placeholder="••••••••" class="w-full p-2.5 border rounded-lg text-xs focus:ring-2 focus:ring-black outline-none">
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-black text-white font-bold py-3 rounded-full text-xs uppercase hover:bg-gray-800 transition">
                    Login
                </button>
            </form>

            <div class="mt-4 text-center">
                <p class="text-[11px] text-gray-500">Need help? WhatsApp us at <a href="https://wa.me/18763047407" class="text-pink-600 font-bold" target="_blank">+1 (876) 304-7407</a></p>
            </div>
        </div>
    </div>

    <!-- SIZE SELECTION POPUP MODAL -->
    <div class="modal-overlay bottom-sheet" id="sizeModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Select Size</div>
                <button class="close-modal-btn" onclick="closeSizeModal()">&times;</button>
            </div>
            <div class="flex gap-3 mb-4">
                <img id="modalProductImg" class="w-16 h-16 object-cover rounded-lg border" src="" alt="">
                <div class="flex flex-col justify-center">
                    <div id="modalProductTitle" class="font-bold text-xs"></div>
                    <div id="modalProductPrice" class="text-pink-600 font-extrabold text-sm mt-0.5"></div>
                </div>
            </div>
            <div id="modalSizeSection">
                <div class="text-xs text-gray-500 mb-2 font-semibold">AVAILABLE SIZES:</div>
                <div class="size-options-grid" id="sizeOptionsGrid"></div>
            </div>
            <button class="w-full bg-black text-white font-bold py-3.5 rounded-full uppercase text-xs" onclick="confirmAddToCart()">Add to Bag</button>
        </div>
    </div>

    <!-- CART DASHBOARD VIEW -->
    <div id="cart-dashboard">
        <div class="dashboard-header">
            <h2 class="font-extrabold text-lg">Shopping Bag (<span id="dashboard-cart-count">0</span>)</h2>
            <button class="back-home-btn" onclick="returnToHome()">← Back to Shop</button>
        </div>

        <div class="dashboard-items-list" id="dashboardItemsList"></div>

        <div class="cart-summary-box" id="cartSummaryBox">
            <div style="font-weight: bold; text-transform: uppercase; font-size: 13px;">Total</div>
            <div style="font-size: 18px; font-weight: bold; color: var(--magenta);" id="cartTotalDisplay">$0 JMD</div>
        </div>

        <div id="dashboardActions" class="flex flex-col gap-2">
            <button class="dashboard-whatsapp-btn" onclick="checkoutWhatsApp()">💬 Checkout via WhatsApp</button>
            <button class="text-gray-400 text-xs underline py-1 hover:text-gray-600" onclick="clearCart()">Clear All Items</button>
        </div>
    </div>

    <script>
        // GLOBAL STATE
        let cart = JSON.parse(localStorage.getItem('cc_cart')) || [];
        let activeItemForModal = null;
        let selectedSize = '';
        let currentAuthMode = 'login';
        let lastScrollPosition = 0;

        // CUSTOMER AUTHENTICATION STATE
        let currentUser = JSON.parse(localStorage.getItem('cc_user')) || null;
        let registeredUsers = JSON.parse(localStorage.getItem('cc_registered_users')) || [
            { username: 'fashionista', email: 'customer@example.com', password: 'password123' }
        ];

        // HERO BANNER SLIDER LOGIC
        let currentSlideIndex = 0;
        let slideTimer = null;

        function showHeroSlide(index) {
            const slides = document.querySelectorAll('.hero-slide');
            const dots = document.querySelectorAll('.dot');
            if (slides.length === 0) return;

            if (index >= slides.length) currentSlideIndex = 0;
            else if (index < 0) currentSlideIndex = slides.length - 1;
            else currentSlideIndex = index;

            slides.forEach((slide, idx) => {
                slide.classList.toggle('active', idx === currentSlideIndex);
            });

            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlideIndex);
            });
        }

        function changeHeroSlide(direction) {
            showHeroSlide(currentSlideIndex + direction);
            resetSlideTimer();
        }

        function goToHeroSlide(index) {
            showHeroSlide(index);
            resetSlideTimer();
        }

        function startSlideTimer() {
            slideTimer = setInterval(() => {
                showHeroSlide(currentSlideIndex + 1);
            }, 5000);
        }

        function resetSlideTimer() {
            clearInterval(slideTimer);
            startSlideTimer();
        }

        // AUTHENTICATION UI & LOGIC
        function updateAuthUI() {
            const userBox = document.getElementById('userHeaderBox');

            if (currentUser) {
                userBox.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-gray-700 hidden sm:inline">@${currentUser.username}</span>
                        <button onclick="handleLogout()" class="text-[11px] font-bold bg-gray-100 text-gray-800 px-2.5 py-1 rounded-full border hover:bg-red-50 hover:text-red-600 transition">
                            Logout
                        </button>
                    </div>
                `;
            } else {
                userBox.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-xs font-bold bg-black text-white px-3 py-1.5 rounded-full hover:bg-gray-800 transition">
                        🔑 Login
                    </button>
                `;
            }
        }

        function openAuthModal(mode = 'login') {
            currentAuthMode = mode;
            switchAuthTab(mode);
            document.getElementById('authModal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');
            const title = document.getElementById('authModalTitle');
            const submitBtn = document.getElementById('authSubmitBtn');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-2 font-bold text-center border-b-2 border-black text-xs uppercase text-black";
                signupBtn.className = "flex-1 py-2 font-bold text-center text-gray-400 border-b-2 border-transparent text-xs uppercase";
                title.innerText = "Login to Crush Closet";
                submitBtn.innerText = "Login";
            } else {
                signupBtn.className = "flex-1 py-2 font-bold text-center border-b-2 border-black text-xs uppercase text-black";
                loginBtn.className = "flex-1 py-2 font-bold text-center text-gray-400 border-b-2 border-transparent text-xs uppercase";
                title.innerText = "Create Your Account";
                submitBtn.innerText = "Create Account";
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            const email = document.getElementById('authEmail').value.trim().toLowerCase();
            const password = document.getElementById('authPassword').value;

            if (currentAuthMode === 'signup') {
                const existing = registeredUsers.find(u => u.email === email || u.username === username);
                if (existing) {
                    alert("An account with this email or username already exists. Please login.");
                    switchAuthTab('login');
                    return;
                }

                const newUser = { username, email, password };
                registeredUsers.push(newUser);
                localStorage.setItem('cc_registered_users', JSON.stringify(registeredUsers));

                currentUser = newUser;
                localStorage.setItem('cc_user', JSON.stringify(currentUser));
            } else {
                const user = registeredUsers.find(u => u.email === email && u.password === password);
                if (!user) {
                    const newTestUser = { username, email, password };
                    registeredUsers.push(newTestUser);
                    localStorage.setItem('cc_registered_users', JSON.stringify(registeredUsers));
                    currentUser = newTestUser;
                    localStorage.setItem('cc_user', JSON.stringify(currentUser));
                } else {
                    currentUser = user;
                    localStorage.setItem('cc_user', JSON.stringify(currentUser));
                }
            }

            updateAuthUI();
            closeAuthModal();
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('cc_user');
            updateAuthUI();
        }

        // INVENTORY DATABASE
        let inventory = JSON.parse(localStorage.getItem('cc_inventory')) || {
            'bikini': [
                { name: "Swim Cutout Blue Bikini", price: "3,800", stockTag: "⏳ Only 9 left", image: "bikini1.png", sizes: ["S", "M", "L"] },
                { name: "Women's Casual Blue Spaghetti Bikini", price: "3,500", stockTag: "15+ sold", image: "bikini2.png", sizes: ["S", "M", "L"] },
                { name: "Pink Neon Glam Bikini Set", price: "3,400", stockTag: "⏳ Only 9 left", image: "bikini3.png", sizes: ["S", "M", "L"] },
                { name: "Sunset High-Waist Beach Bikini", price: "3,700", stockTag: "10+ sold", image: "bikini4.png", sizes: ["S", "M", "L"] },
                { name: "Trim Swim Set", price: "5,000", stockTag: "⏳ Only 5 left", image: "bikini5.png", sizes: ["S", "M", "L"] }
                { name: "pink one piece Set", price: "3,800", stockTag: "⏳ Only 5 left", image: "bikini6.png", sizes: ["S", "M", "L"] }
            ],
            'dress': [
                { name: "Elegant Satin Evening Mini Dress", price: "7,500", stockTag: "⏳ Only 9 left", image: "dress1.png", sizes: ["S", "M", "L"] },
                { name: "PartyGlam Bodycon Club Dress", price: "7,500", stockTag: "200+ sold", image: "dress2.png", sizes: ["S", "M", "L"] },
                { name: "Floral Summer Vacation Maxi Dress", price: "7,500", stockTag: "⏳ Only 4 left", image: "dress3.png", sizes: ["S", "M", "L"] }
            ],
            'shirt': [
                { name: "Silk Touch Casual Button Shirt", price: "4,500", stockTag: "100+ sold", image: "shirt1.png", sizes: ["S", "M", "L", "XL"] },
                { name: "Oversized Summer Resort Shirt", price: "4,500", stockTag: "⏳ Only 9 left", image: "shirt2.png", sizes: ["S", "M", "L", "XL"] }
            ],
            'cologne': [
                { name: "Luxury Eau De Parfum Signature", price: "12,000", stockTag: "⏳ Only 3 left", image: "cologne1.png", sizes: ["Standard"] }
            ],
            'bracelet': [
                { name: "1pc Vintage Rhinestone Tree Bracelet", price: "2,500", stockTag: "⏳ Only 9 left", image: "bracelet1.png", sizes: ["One Size"] },
                { name: "Jealous Young Elegant Tulip Ring", price: "2,900", stockTag: "100+ sold", image: "bracelet2.png", sizes: ["One Size"] }
            ],
            'lipstick': [
                { name: "Matte Velvet Long-Lasting Lipstick", price: "1,800", stockTag: "500+ sold", image: "lipstick1.png", sizes: ["Standard"] }
            ]
        };

        function showCategory(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            const container = document.getElementById('product-display');
            container.innerHTML = '';
            const items = inventory[category] || [];

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center text-xs text-gray-500 py-10">No items available in this category yet.</div>`;
                return;
            }

            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let tagHtml = item.stockTag.includes('Only') || item.stockTag.includes('New')
                    ? `<div class="stock-tag">${item.stockTag}</div>` 
                    : `<div class="sales-tag">${item.stockTag}</div>`;

                card.innerHTML = `
                    <div class="product-image-wrap">
                        <img src="${item.image}" class="product-image" onerror="this.src='https://placehold.co/300x360/111111/D4AF37?text=Crush+Closet';">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-title">${item.name}</div>
                            ${tagHtml}
                        </div>
                        <div class="card-bottom-row">
                            <div class="price-box">
                                <span class="current-price">$${item.price}</span>
                                <span class="jmd-label">JMD</span>
                            </div>
                            <button class="quick-cart-btn" onclick="openSizeModal('${category}', ${idx})">🛒</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openSizeModal(category, index) {
            activeItemForModal = inventory[category][index];
            selectedSize = activeItemForModal.sizes[0];

            const imgEl = document.getElementById('modalProductImg');
            imgEl.src = activeItemForModal.image;
            imgEl.onerror = () => { imgEl.src = 'https://placehold.co/100x100/111111/D4AF37?text=Crush'; };

            document.getElementById('modalProductTitle').innerText = activeItemForModal.name;
            document.getElementById('modalProductPrice').innerText = `$${activeItemForModal.price} JMD`;

            const grid = document.getElementById('sizeOptionsGrid');
            const sizeSection = document.getElementById('modalSizeSection');

            if (activeItemForModal.sizes.length === 1 && (activeItemForModal.sizes[0] === 'Standard' || activeItemForModal.sizes[0] === 'One Size')) {
                sizeSection.style.display = 'none';
            } else {
                sizeSection.style.display = 'block';
                grid.innerHTML = activeItemForModal.sizes.map((s, i) => `
                    <div class="size-btn ${i === 0 ? 'selected' : ''}" onclick="selectSizeOption('${s}', this)">${s}</div>
                `).join('');
            }

            document.getElementById('sizeModal').style.display = 'flex';
        }

        function selectSizeOption(size, el) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function closeSizeModal() {
            document.getElementById('sizeModal').style.display = 'none';
        }

        function confirmAddToCart() {
            if (!activeItemForModal) return;
            
            cart.push({
                name: activeItemForModal.name,
                price: activeItemForModal.price,
                size: selectedSize,
                image: activeItemForModal.image
            });

            localStorage.setItem('cc_cart', JSON.stringify(cart));
            updateCartUI();
            closeSizeModal();
        }

        function calculateCartTotal() {
            return cart.reduce((total, item) => {
                let numericPrice = parseFloat(item.price.replace(/,/g, '')) || 0;
                return total + numericPrice;
            }, 0);
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('header-cart-count').innerText = cart.length;
            document.getElementById('dashboard-cart-count').innerText = cart.length;

            const listContainer = document.getElementById('dashboardItemsList');
            const summaryBox = document.getElementById('cartSummaryBox');
            const actionsContainer = document.getElementById('dashboardActions');
            listContainer.innerHTML = '';

            if (cart.length === 0) {
                listContainer.innerHTML = `<div class="empty-dashboard">Your bag is currently empty.</div>`;
                summaryBox.style.display = 'none';
                actionsContainer.style.display = 'none';
                return;
            }

            summaryBox.style.display = 'flex';
            actionsContainer.style.display = 'flex';

            cart.forEach((item, idx) => {
                const itemCard = document.createElement('div');
                itemCard.className = 'dashboard-item-card';
                itemCard.innerHTML = `
                    <img src="${item.image}" class="dashboard-item-img" onerror="this.src='https://placehold.co/100x100/111111/D4AF37?text=Crush';">
                    <div class="dashboard-item-info">
                        <div class="dashboard-item-title">${item.name}</div>
                        <div class="dashboard-item-size">Size: ${item.size}</div>
                        <div class="dashboard-item-price">$${item.price} JMD</div>
                    </div>
                    <button class="dashboard-remove-btn" onclick="removeCartItem(${idx})">&times;</button>
                `;
                listContainer.appendChild(itemCard);
            });

            document.getElementById('cartTotalDisplay').innerText = `$${calculateCartTotal().toLocaleString()} JMD`;
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cc_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function openCartDashboard() {
            lastScrollPosition = window.scrollY || window.pageYOffset || 0;
            updateCartUI();
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('cart-dashboard').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function returnToHome() {
            document.getElementById('cart-dashboard').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo({ top: lastScrollPosition, behavior: 'instant' });
        }

        function clearCart() {
            cart = [];
            localStorage.removeItem('cc_cart');
            updateCartUI();
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return;
            let totalVal = calculateCartTotal().toLocaleString();
            let itemList = cart.map(i => `• ${i.name} (Size: ${i.size}) - $${i.price} JMD`).join("\n");
            
            let userHeader = currentUser ? `Customer: @${currentUser.username}\n\n` : ``;
            let msg = `Crush Closet Order:\n\n${userHeader}${itemList}\n\n*Total Amount:* $${totalVal} JMD`;
            
            window.open("https://wa.me/18763047407?text=" + encodeURIComponent(msg));
        }

        function shareWebsite() {
            if (navigator.share) {
                navigator.share({ title: 'Crush Closet', url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
            }
        }

        window.onload = () => {
            updateAuthUI();
            showCategory('bikini', document.querySelector('.filter-btn.active'));
            updateCartUI();
            startSlideTimer();
        };
    </script>
</body>
</html>
