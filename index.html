<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crush closet | Luxury Collection</title>
    <style>
        :root { --gold: #D4AF37; --magenta: #C70066; --black: #111; --white: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--white); color: var(--black); padding-bottom: 180px; overflow-x: hidden; }
        
        /* Smooth Entrance Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slideshow-container { width: 100%; position: relative; background-color: #fff; line-height: 0; }
        .slide { width: 100%; height: auto; display: none; object-fit: contain; }

        .inner-circle { background: var(--black); color: var(--gold); padding: 25px 20px; text-align: center; border-top: 3px solid var(--gold); }
        .inner-circle h3 { margin-bottom: 5px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
        .handle { color: var(--magenta); font-weight: bold; }
        .insta-btn { display: inline-block; margin-top: 15px; background: var(--gold); color: #000; padding: 12px 35px; text-decoration: none; font-weight: bold; border-radius: 50px; text-transform: uppercase; font-size: 12px; }

        .filter-menu { display: flex; overflow-x: auto; background: #fff; padding: 15px; position: sticky; top: 0; z-index: 100; gap: 10px; border-bottom: 1px solid #eee; }
        .filter-menu::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 10px 20px; border: 1px solid #ddd; background: #fff; border-radius: 25px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .filter-btn.active { background: var(--black); color: #fff; border-color: var(--black); }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .product-card { 
            border: 1px solid #f2f2f2; 
            border-radius: 8px; 
            overflow: hidden; 
            display: none; 
            flex-direction: column; 
            background: #fff;
            animation: fadeInUp 0.6s ease forwards;
        }
        .product-image { width: 100%; height: auto; object-fit: contain; }
        .product-info { padding: 12px; text-align: center; }
        .price-tag { color: var(--magenta); font-weight: bold; font-size: 16px; margin-bottom: 5px; }

        /* Suggestion Label */
        .suggestion-tag { font-size: 9px; color: var(--gold); font-weight: bold; text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        .size-selector { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 11px; outline: none; }
        .add-btn { background: var(--black); color: white; border: none; width: 100%; padding: 14px; font-size: 11px; font-weight: bold; text-transform: uppercase; border-radius: 5px; cursor: pointer; }

        .checkout-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 15px; border-top: 1px solid #eee; z-index: 1000; text-align: center; }
        .footer-buttons { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 90%; margin: 0 auto; }
        .cart-float { width: 100%; background: var(--gold); color: #000; padding: 16px 0; border-radius: 50px; font-weight: bold; border: none; font-size: 13px; text-transform: uppercase; cursor: pointer; }
        .share-btn { width: 100%; background: #f2f2f2; color: var(--black); padding: 12px 0; border-radius: 50px; font-weight: bold; border: 1px solid #ddd; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .clear-cookie-btn { display: block; margin: 8px auto 0; font-size: 10px; color: #999; background: none; border: none; text-decoration: underline; cursor: pointer; }

        /* Floating WhatsApp Chat Bubble */
        .whatsapp-float {
            position: fixed;
            bottom: 130px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1001;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        /* Dedicated Cart Dashboard View */
        #cart-dashboard {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 0.4s ease forwards;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--black);
            padding-bottom: 15px;
        }
        .dashboard-header h2 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-home-btn {
            background: var(--black);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }
        .dashboard-items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .dashboard-item-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .dashboard-item-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 6px;
            background: #f9f9f9;
            border: 1px solid #f2f2f2;
        }
        .dashboard-item-info {
            flex-grow: 1;
            font-size: 13px;
        }
        .dashboard-item-title {
            font-weight: bold;
            color: var(--black);
            margin-bottom: 4px;
        }
        .dashboard-item-size {
            color: #666;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .dashboard-item-price {
            color: var(--magenta);
            font-weight: bold;
            font-size: 14px;
        }
        .dashboard-remove-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
        }

        /* Order Summary Container */
        .cart-summary-box {
            background: #fdfdfd;
            border: 1px dashed var(--gold);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-label {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--black);
        }
        .summary-total {
            font-size: 20px;
            font-weight: bold;
            color: var(--magenta);
        }

        .dashboard-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .dashboard-whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            text-align: center;
        }
        .empty-dashboard {
            text-align: center;
            color: #777;
            font-size: 14px;
            padding: 50px 0;
        }
    </style>
</head>
<body>

    <!-- MAIN HOMEPAGE VIEW CONTAINER -->
    <div id="home-view">
        <div class="slideshow-container" id="slideshow">
            <img class="slide" src="hero1.jpg" onerror="this.src='hero1.png';">
            <img class="slide" src="hero2.jpg" onerror="this.src='hero2.png';">
            <img class="slide" src="hero3.jpg" onerror="this.src='hero3.png';">
            <img class="slide" src="hero4.jpg" onerror="this.src='hero4.png';">
        </div>

        <div class="inner-circle">
            <h3> ✨YOUR NEXT FAVORITE LOOK STARTS HERE✨ </h3>
                      <h3>✨crush closet✨</h3>
            <a href="https://instagram.com/crush_closet_ja" class="insta-btn" target="_blank">
        </div

        <div class="filter-menu">
            <button class="filter-btn active" onclick="showCategory('bikini', this)">Bikinis</button>
            <button class="filter-btn" onclick="showCategory('dress', this)">Dresses</button>
            <button class="filter-btn" onclick="showCategory('shirt', this)">Shirts</button>
            <button class="filter-btn" onclick="showCategory('cologne', this)">Cologne</button>
            <button class="filter-btn" onclick="showCategory('bracelet', this)">Bracelets</button>
            <button class="filter-btn" onclick="showCategory('lipstick', this)">Lipstick</button>
        </div>

        <div id="product-display" class="product-grid"></div>

        <!-- Floating WhatsApp Chat Bubble -->
        <a href="https://wa.me/18763047407?text=Hi,%20I%20have%20a%20question%20about%20an%20item%20at%20crush%20closet!" class="whatsapp-float" target="_blank" title="Chat with us on WhatsApp">
            💬
        </a>

        <div class="checkout-footer">
            <div class="footer-buttons">
                <button class="cart-float" onclick="openCartDashboard()">
                    View Bag & Checkout (<span id="cart-count">0</span>)
                </button>
                <button class="share-btn" onclick="shareWebsite()">
                    🔗 Share Website with Friends
                </button>
            </div>
            <button class="clear-cookie-btn" onclick="clearCart()">Clear Bag / Reset Cookies</button>
        </div>
    </div>

    <!-- DEDICATED CART DASHBOARD VIEW CONTAINER -->
    <div id="cart-dashboard">
        <div class="dashboard-header">
            <h2>Your Shopping Bag (<span id="dashboard-cart-count">0</span>)</h2>
            <button class="back-home-btn" onclick="returnToHome()">← Home</button>
        </div>

        <div class="dashboard-items-list" id="dashboardItemsList">
            <!-- Items with images populate here -->
        </div>

        <!-- Order Total Summary Box -->
        <div class="cart-summary-box" id="cartSummaryBox">
            <div class="summary-label">Estimated Total</div>
            <div class="summary-total" id="cartTotalDisplay">$0 JMD</div>
        </div>

        <div class="dashboard-actions" id="dashboardActions">
            <button class="dashboard-whatsapp-btn" onclick="checkoutWhatsApp()">
                💬 Checkout via WhatsApp
            </button>
            <button class="clear-cookie-btn" onclick="clearCart()">Clear All Items</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cc_cart')) || [];
        let slideIndex = 0;

        const inventory = {
            'bikini': { 
                prefix: 'bikini', label: 'Bikini', 
                prices: [
                    "3,800", "3,500", "3,400", "3,700", "5,000", "5,000", "5,000", "5,000", "5,000", "5,000",
                    ...Array(90).fill("5,000")
                ], 
                sizes: ["S", "M", "L"], pairWith: "cover-up" 
            },
            'dress': { 
                prefix: 'dress', label: 'Dress', 
                prices: [
                    "7,500", "7,500", "7,500", "7,500", "7,500", "7,500", "7,500", "7,500", "7,500", "7,500",
                    ...Array(90).fill("7,500")
                ], 
                sizes: ["S", "M", "L"], pairWith: "bracelet" 
            },
            'shirt': { 
                prefix: 'shirt', label: 'Shirt', 
                prices: [
                    "4,500", "4,500", "4,500", "4,500", "4,500", "4,500", "4,500", "4,500", "4,500", "4,500",
                    ...Array(90).fill("4,500")
                ], 
                sizes: ["S", "M", "L", "XL"], pairWith: "cologne" 
            },
            'cologne': { 
                prefix: 'cologne', label: 'Cologne', 
                prices: [
                    "12,000", "12,000", "12,000", "12,000", "12,000", "12,000", "12,000", "12,000", "12,000", "12,000",
                    ...Array(90).fill("12,000")
                ], 
                sizes: ["Standard"], pairWith: "shirt" 
            },
            'bracelet': { 
                prefix: 'bracelet', label: 'Bracelet', 
                prices: [
                    "2,500", "2,500", "2,500", "2,500", "2,500", "2,500", "2,500", "2,500", "2,500", "2,500",
                    ...Array(90).fill("2,500")
                ], 
                sizes: ["One Size"], pairWith: "dress" 
            },
            'lipstick': { 
                prefix: 'lipstick', label: 'Lipstick', 
                prices: [
                    "1,800", "1,800", "1,800", "1,800", "1,800", "1,800", "1,800", "1,800", "1,800", "1,800",
                    ...Array(90).fill("1,800")
                ], 
                sizes: ["Standard"], pairWith: "bikini" 
            }
        };

        function startSlideshow() {
            let slides = document.querySelectorAll(".slide");
            slides.forEach(s => s.style.display = "none");
            slideIndex++;
            if (slideIndex > slides.length) {slideIndex = 1}
            if(slides[slideIndex-1]) slides[slideIndex-1].style.display = "block";
            setTimeout(startSlideshow, 4000);
        }

        function showCategory(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const container = document.getElementById('product-display');
            container.innerHTML = '';
            const data = inventory[category];

            for (let i = 1; i <= 100; i++) {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${(i % 10) * 0.05}s`;
                
                const price = data.prices[i - 1] || data.prices[0];
                let sizeOptions = data.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
                let imgSrc = `${data.prefix}${i}.png`;

                card.innerHTML = `
                    <img src="${imgSrc}" class="product-image" 
                         onerror="this.src='${data.prefix}${i}.jpg'; this.onerror=function(){this.closest('.product-card').remove();}" 
                         onload="this.closest('.product-card').style.display='flex'">
                    <div class="product-info">
                        <span class="suggestion-tag">Pairs well with ${data.pairWith}</span>
                        <div class="price-tag">$${price} JMD</div>
                        <select class="size-selector" id="size-${category}-${i}">
                            <option value="">Select Size</option>
                            ${sizeOptions}
                        </select>
                        <button class="add-btn" onclick="addToCart('${data.label} #${i}', '${price}', '${imgSrc}', '${category}', ${i})">Add to Bag</button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function addToCart(itemName, price, imgSrc, category, index) {
            const sizeVal = document.getElementById(`size-${category}-${index}`).value;
            if(!sizeVal) return alert("Please select a size!");
            cart.push({ name: itemName, size: sizeVal, price: price, image: imgSrc });
            localStorage.setItem('cc_cart', JSON.stringify(cart));
            updateCartUI();
            openCartDashboard();
        }

        function calculateCartTotal() {
            return cart.reduce((total, item) => {
                let numericPrice = parseFloat(item.price.replace(/,/g, '')) || 0;
                return total + numericPrice;
            }, 0);
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('dashboard-cart-count').innerText = cart.length;
            
            const listContainer = document.getElementById('dashboardItemsList');
            const actionsContainer = document.getElementById('dashboardActions');
            const summaryBox = document.getElementById('cartSummaryBox');
            listContainer.innerHTML = '';

            if (cart.length === 0) {
                listContainer.innerHTML = `<div class="empty-dashboard">Your bag is currently empty.</div>`;
                actionsContainer.style.display = 'none';
                summaryBox.style.display = 'none';
                return;
            }

            actionsContainer.style.display = 'flex';
            summaryBox.style.display = 'flex';

            cart.forEach((cartItem, idx) => {
                const itemCard = document.createElement('div');
                itemCard.className = 'dashboard-item-card';
                itemCard.innerHTML = `
                    <img src="${cartItem.image}" class="dashboard-item-img" onerror="this.src='hero1.jpg';">
                    <div class="dashboard-item-info">
                        <div class="dashboard-item-title">${cartItem.name}</div>
                        <div class="dashboard-item-size">Size: ${cartItem.size}</div>
                        <div class="dashboard-item-price">$${cartItem.price} JMD</div>
                    </div>
                    <button class="dashboard-remove-btn" onclick="removeCartItem(${idx})" title="Remove item">&times;</button>
                `;
                listContainer.appendChild(itemCard);
            });

            // Update Total Price Display
            const totalVal = calculateCartTotal();
            document.getElementById('cartTotalDisplay').innerText = `$${totalVal.toLocaleString()} JMD`;
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cc_cart', JSON.stringify(cart));
            updateCartUI();
        }

        function openCartDashboard() {
            updateCartUI();
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('cart-dashboard').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function returnToHome() {
            document.getElementById('cart-dashboard').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function clearCart() {
            if(confirm("Clear bag?")) {
                cart = [];
                localStorage.removeItem('cc_cart');
                updateCartUI();
            }
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) return alert("Bag is empty!");
            let totalVal = calculateCartTotal().toLocaleString();
            let itemList = cart.map(i => `• ${i.name} (Size: ${i.size}) - $${i.price} JMD`).join("\n");
            let msg = `crush closet Order:\n\n${itemList}\n\n*Total Amount:* $${totalVal} JMD`;
            window.open("https://wa.me/18763047407?text=" + encodeURIComponent(msg));
        }

        function shareWebsite() {
            if (navigator.share) {
                navigator.share({
                    title: 'crush closet | Luxury Collection',
                    text: 'Check out the luxury collection at crush closet!',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Website link copied to clipboard!");
            }
        }

        window.onload = () => {
            startSlideshow();
            showCategory('bikini', document.querySelector('.filter-btn.active'));
            updateCartUI();
        };
    </script>
</body>
</html>
